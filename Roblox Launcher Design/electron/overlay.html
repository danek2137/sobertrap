<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let opts = { type: 'cross', color: '#00ff00', size: 5, opacity: 0.8 };

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  draw();
}
window.addEventListener('resize', resize);

function draw() {
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  ctx.globalAlpha = opts.opacity ?? 1;
  ctx.strokeStyle = opts.color || '#00ff00';
  ctx.fillStyle = opts.color || '#00ff00';
  ctx.lineWidth = 2;

  const cx = w / 2, cy = h / 2;
  const s = Math.max(4, (opts.size || 5) * 4);

  switch (opts.type) {
    case 'dot':
      ctx.beginPath();
      ctx.arc(cx, cy, Math.max(2, s * 0.35), 0, Math.PI * 2);
      ctx.fill();
      break;
    case 'cross':
      ctx.beginPath();
      ctx.moveTo(cx - s, cy); ctx.lineTo(cx + s, cy);
      ctx.moveTo(cx, cy - s); ctx.lineTo(cx, cy + s);
      ctx.stroke();
      break;
    case 'circle':
      ctx.beginPath();
      ctx.arc(cx, cy, s * 0.7, 0, Math.PI * 2);
      ctx.stroke();
      break;
    case 'crosshair':
      ctx.beginPath();
      ctx.arc(cx, cy, s * 0.45, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(cx - s, cy); ctx.lineTo(cx + s, cy);
      ctx.moveTo(cx, cy - s); ctx.lineTo(cx, cy + s);
      ctx.stroke();
      break;
    case 'plus':
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(cx - s, cy); ctx.lineTo(cx + s, cy);
      ctx.moveTo(cx, cy - s); ctx.lineTo(cx, cy + s);
      ctx.stroke();
      break;
  }

  ctx.globalAlpha = 1;
}

window.addEventListener('update-crosshair', (e) => {
  opts = { ...opts, ...e.detail };
  draw();
});

resize();
</script>
</body>
</html>
